<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shopping Header Practice</title><style>body{font:15px Arial;background:#eef4fa}header{display:flex;align-items:center;justify-content:space-around;gap:18px;background:#0b2545;color:white;padding:20px}form{display:flex;flex:1}input,select,button{padding:11px;border-radius:6px}a{color:white} @media(max-width:850px){header{flex-wrap:wrap}}</style></head><body><header><strong>MIAT Store</strong><span>Deliver to<br>Chennai, Tamil Nadu</span><form><select aria-label="Category"><option>All Categories</option><option>Books</option><option>Clothing</option></select><input placeholder="Search products"><button>Search</button></form><span>Hello, Guest<br>Account &amp; Lists</span><span>Returns &amp; Orders</span><span>Cart (0)</span></header></body></html>
