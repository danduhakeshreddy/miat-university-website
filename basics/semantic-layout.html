<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Semantic Layout</title><style>.layout{display:grid;grid-template-columns:2fr 1fr;grid-template-areas:"header header" "nav nav" "section aside" "article aside" "footer footer";gap:8px;padding:20px;font-family:Arial}.layout>*{padding:22px;min-height:55px}.layout header{grid-area:header;background:#e66a61}.layout nav{grid-area:nav;background:#67d7d7}.layout section{grid-area:section;background:#ffd35c}.layout article{grid-area:article;background:#f49b4a}.layout aside{grid-area:aside;background:#f2a5bd}.layout footer{grid-area:footer;background:#bbb}</style></head><body><main class="layout"><header>&lt;header&gt; MIAT</header><nav>&lt;nav&gt; Home · Courses · Contact</nav><section>&lt;section&gt;<br><img src="../images/gallery-2.svg" alt="Illustration" width="280"></section><article>&lt;article&gt;<br>Learning through practice and discovery.</article><aside>&lt;aside&gt;<br>Related links and updates.</aside><footer>&lt;footer&gt; Engineering Tomorrow, Today</footer></main></body></html>
